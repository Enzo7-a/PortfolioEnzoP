<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Club Med</title>
  <link rel="stylesheet" href="../../Assets/Css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body id="page-projets">
  <nav class="navbar">
    <div class="nav-left"><a href="../../index.html" class="nav-brand" data-key="nav-brand"></a></div>
    <div class="nav-center" id="nav-menu">
      <ul class="nav-links">
        <li><a href="../../projets.html" class="active" data-key="nav-projects"></a></li>
        <li><a href="../../index.html" data-key="nav-home"></a></li>
        <li><a href="../../cv.html" data-key="nav-cv"></a></li>
      </ul>
    </div>
    <div class="nav-right">
      <ul class="lang-switcher">
        <li><a href="#" class="active" data-lang="en">EN</a></li>
        <li><a href="#" data-lang="fr">FR</a></li>
      </ul>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main class="content">
    <section class="cv-background"> 
      <section class="cv-wrapper">
        <div class="text-column">
          <div class="cv-content-wrapper"> 
            
            <div class="project-back">
                <a href="../../projets.html" class="project-button" data-key="btn-back-projects"></a>
            </div>

            <header class="project-page-header">
                <span class="project-category-badge" data-key="p1-badge"></span>
                <h1 class="project-title" data-key="p1-title"></h1>
                <p class="project-date" data-key="p1-date"></p>
            </header>
            <div class="project-carousel">
          <img src="../../Assets/Image/ImageLaravel1.png" alt="Laravel Main" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageLaravel2.png" alt="Laravel Screen 2" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageLaravel3.png" alt="Laravel Screen 3" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageLaravel4.png" alt="Laravel Screen 4" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageLaravel5.png" alt="Laravel Screen 5" class="carousel-img" loading="lazy">
            </div>

            <div class="project-detail-grid">
                
                <div class="project-info-section">
                    <h2 data-key="sec-start"></h2>
                    <p data-key="p1-start"></p>

                    <h2 data-key="sec-did-team"></h2>
                    <ul class="soft-skills-list">
                        <li data-key="p1-list1"></li>
                        <li data-key="p1-list2"></li>
                        <li data-key="p1-list3"></li>
                        <li data-key="p1-list4"></li>
                        <li data-key="p1-list5"></li>
                        <li data-key="p1-list6"></li>
                    </ul>

                    <h2 data-key="sec-result"></h2>
                    <p data-key="p1-result"></p>
                </div>

                <div class="project-sidebar">
                    <div class="project-sidebar-card">
                        <div class="sidebar-title" data-key="tech-title"></div>
                        <div class="tech-tags-container">
                            <span class="tech-tag-pill" data-key="tag-laravel"></span>
                            <span class="tech-tag-pill" data-key="tag-php"></span>
                            <span class="tech-tag-pill" data-key="tag-sql"></span>
                            <span class="tech-tag-pill" data-key="tag-bpmn"></span>
                            <span class="tech-tag-pill" data-key="tag-git"></span>
                        </div>
                    </div>

                    <div class="project-sidebar-card">
                        <div class="sidebar-title" data-key="resources-title"></div>
                        
                        <a href="https://github.com/Youpfun/Club-Med-Copy" target="_blank" class="cta-button btn-full-width" data-key="btn-view-repo"></a>
                    </div>
                </div>
            </div>

          </div> 
        </div>
      </section>
    </section>
  </main>

  <script src="../../Assets/Javascript/script.js"></script>
</body>
</html>
