<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Projet Sibilia</title>
  <link rel="stylesheet" href="../../Assets/Css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body id="page-projets">

  <nav class="navbar">
    <div class="nav-left"><a href="../../index.html" class="nav-brand" data-key="nav-brand"></a></div>
    <div class="nav-center">
      <ul class="nav-links">
        <li><a href="../../projets.html" class="active" data-key="nav-projects"></a></li>
        <li><a href="../../index.html" data-key="nav-home"></a></li>
        <li><a href="../../cv.html" data-key="nav-cv"></a></li>
        <li><a href="../../contact.html" data-key="nav-contact"></a></li>
      </ul>
    </div>
    <div class="nav-right">
      <ul class="lang-switcher">
        <li><a href="#" class="active" data-lang="en">EN</a></li>
        <li><a href="#" data-lang="fr">FR</a></li>
      </ul>
    </div>
  </nav>

  <main class="content">
    <section class="cv-background"> 
      <section class="cv-wrapper"> 
        <div class="text-column">
          <div class="cv-content-wrapper"> 
            
            <div style="margin-bottom: 20px;">
                <a href="../../projets.html" class="project-button" data-key="btn-back-projects"></a>
            </div>

            <header class="project-page-header">
                <span class="project-category-badge" data-key="p5-badge"></span>
                <h1 style="font-size: 2.5rem; margin: 10px 0;" data-key="p5-title"></h1>
                <p style="color: #ccc;" data-key="p5-date"></p>
            </header>
            <div class="project-carousel">
          <img src="../../Assets/Image/ImageSibilia1.png" alt="Interface WPF Sibilia" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageSibilia2.png" alt="Interface WPF Sibilia" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageSibilia3.png" alt="Interface WPF Sibilia" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageSibilia4.png" alt="Interface WPF Sibilia" class="carousel-img" loading="lazy">
          <img src="../../Assets/Image/ImageSibilia5.png" alt="Interface WPF Sibilia" class="carousel-img" loading="lazy">
            </div>

            <div class="project-detail-grid">
                
                <div class="project-info-section">
                    <h2 data-key="p5-section1-title"></h2>
                    <p data-key="p5-desc"></p>

                    <h2 data-key="p5-section2-title"></h2>
                    <p data-key="p5-desc2"></p>
                    <ul class="soft-skills-list">
                        <li data-key="p5-list1"></li>
                        <li data-key="p5-list2"></li>
                        <li data-key="p5-list3"></li>
                        <li data-key="p5-list4"></li>
                    </ul>
                </div>

                <div class="project-sidebar">
                    <div class="project-sidebar-card">
                        <div class="sidebar-title" data-key="tech-title"></div>
                        <div class="tech-tags-container">
                            <span class="tech-tag-pill" data-key="tag-csharp"></span>
                            <span class="tech-tag-pill" data-key="tag-wpf"></span>
                            <span class="tech-tag-pill" data-key="tag-sql"></span>
                            <span class="tech-tag-pill" data-key="tag-git"></span>
                        </div>
                    </div>

                    <div class="project-sidebar-card">
                        <div class="sidebar-title" data-key="source-title"></div>
                        <a href="https://github.com/Enzo6975/SIBILIATP11" target="_blank" class="cta-button btn-full-width" data-key="btn-view-repo"></a>
                    </div>
                </div>
            </div>

          </div> 
        </div>
      </section>
    </section>
  </main>

  <script src="../../Assets/Javascript/script.js"></script>

</html>
